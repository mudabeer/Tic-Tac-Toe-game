<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic-Tac-Toe</title>
  <link rel="icon" href="tic-tac-toe.png">
  <style>
    :root {
      color-scheme: dark;
      --bg: #121821;
      --panel: #1c2430;
      --panel-2: #273447;
      --grid: #e2e8f0;
      --muted: #97a4b5;
      --text: #f4f7fb;
      --accent: #57d1a8;
      --x: #ffcd5c;
      --o: #66c2ff;
      --win: #70f5b4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, rgba(87, 209, 168, 0.18), transparent 32rem),
        linear-gradient(135deg, #101621, #1a202c 52%, #111827);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    main {
      width: min(94vw, 620px);
      padding: 24px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .start-screen.active {
      display: grid;
      min-height: min(92vh, 680px);
      place-items: center;
      text-align: center;
    }

    .start-title {
      margin: 0 0 14px;
      font-size: clamp(2.5rem, 10vw, 4.2rem);
      line-height: 1;
      letter-spacing: 0;
    }

    .start-copy {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 1.15rem;
      font-weight: 650;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 3rem);
      line-height: 1;
      letter-spacing: 0;
    }

    .score {
      margin-top: 10px;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 600;
    }

    button {
      border: 0;
      border-radius: 7px;
      background: var(--panel-2);
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      min-height: 44px;
      padding: 0 18px;
    }

    button:hover,
    button:focus-visible {
      outline: 3px solid rgba(87, 209, 168, 0.35);
      background: #34445b;
    }

    .start-button {
      display: inline-grid;
      place-items: center;
      width: 190px;
      height: 190px;
      min-height: 190px;
      padding: 0;
      border-radius: 50%;
      background: transparent;
    }

    .start-button:hover,
    .start-button:focus-visible {
      background: transparent;
    }

    .start-button img {
      display: block;
      width: 190px;
      height: 190px;
      object-fit: contain;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: 8px;
      width: min(100%, 560px);
      aspect-ratio: 1;
      padding: 8px;
      border-radius: 8px;
      background: var(--grid);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
    }

    .cell {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      border: 0;
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      font-size: clamp(3rem, 15vw, 7rem);
      line-height: 1;
      padding: 0;
      overflow: hidden;
    }

    .cell:hover:not(:disabled) {
      background: #273447;
    }

    .cell:disabled {
      cursor: default;
      opacity: 1;
    }

    .cell.x {
      color: var(--x);
    }

    .cell.o {
      color: var(--o);
    }

    .cell.win {
      background: #234d3d;
      color: var(--win);
    }

    .status {
      display: grid;
      place-items: center;
      min-height: 46px;
      margin-top: 18px;
      border-radius: 7px;
      background: var(--panel);
      color: var(--accent);
      font-size: 1.18rem;
      font-weight: 800;
      text-align: center;
      padding: 8px 14px;
    }
  </style>
</head>
<body>
  <main>
    <section class="screen start-screen active" id="startScreen">
      <div>
        <h1 class="start-title">Tic-Tac-Toe</h1>
        <p class="start-copy">Play X against a smarter AI</p>
        <button class="start-button" id="startGame" type="button" aria-label="Start game">
          <img src="start-button.png" alt="">
        </button>
      </div>
    </section>

    <section class="screen" id="gameScreen">
      <header>
        <div>
          <h1>Tic-Tac-Toe</h1>
          <div class="score" id="score">You 0&nbsp;&nbsp;&nbsp;AI 0&nbsp;&nbsp;&nbsp;Draws 0</div>
        </div>
        <button id="newGame" type="button">New Game</button>
      </header>

      <section class="board" aria-label="Tic-Tac-Toe board" id="board"></section>
      <div class="status" id="status">Your turn</div>
    </section>
  </main>

  <script>
    const PLAYER = "X";
    const COMPUTER = "O";
    const EMPTY = "";
    const winLines = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    const startScreen = document.getElementById("startScreen");
    const gameScreen = document.getElementById("gameScreen");
    const startGameButton = document.getElementById("startGame");
    const boardEl = document.getElementById("board");
    const scoreEl = document.getElementById("score");
    const statusEl = document.getElementById("status");
    const newGameButton = document.getElementById("newGame");
    const scores = { player: 0, computer: 0, draw: 0 };
    let board = Array(9).fill(EMPTY);
    let gameOver = false;

    function winningLine(mark) {
      return winLines.find(line => line.every(index => board[index] === mark)) || null;
    }

    function availableMoves() {
      return board.map((value, index) => value === EMPTY ? index : null).filter(index => index !== null);
    }

    function findTacticalMove(mark) {
      for (const line of winLines) {
        const values = line.map(index => board[index]);
        if (values.filter(value => value === mark).length === 2 && values.includes(EMPTY)) {
          return line[values.indexOf(EMPTY)];
        }
      }
      return null;
    }

    function bestMove() {
      const computerWin = findTacticalMove(COMPUTER);
      if (computerWin !== null) return computerWin;

      const playerWin = findTacticalMove(PLAYER);
      if (playerWin !== null) return playerWin;

      if (board[4] === EMPTY) return 4;

      for (const index of [0, 2, 6, 8]) {
        if (board[index] === EMPTY) return index;
      }

      return availableMoves()[0] ?? null;
    }

    function updateScore() {
      scoreEl.innerHTML = `You ${scores.player}&nbsp;&nbsp;&nbsp;AI ${scores.computer}&nbsp;&nbsp;&nbsp;Draws ${scores.draw}`;
    }

    function render(winLine = null) {
      boardEl.innerHTML = "";
      board.forEach((value, index) => {
        const cell = document.createElement("button");
        cell.className = `cell ${value.toLowerCase()}${winLine && winLine.includes(index) ? " win" : ""}`;
        cell.type = "button";
        cell.textContent = value;
        cell.disabled = gameOver || value !== EMPTY;
        cell.setAttribute("aria-label", value ? `Cell ${index + 1}: ${value}` : `Cell ${index + 1}: empty`);
        cell.addEventListener("click", () => play(index));
        boardEl.appendChild(cell);
      });
      updateScore();
    }

    function play(index) {
      if (gameOver || board[index] !== EMPTY) return;

      board[index] = PLAYER;
      if (finishTurn(PLAYER, "You win!")) return;

      const move = bestMove();
      if (move !== null) board[move] = COMPUTER;
      finishTurn(COMPUTER, "AI wins.");
    }

    function finishTurn(mark, message) {
      const line = winningLine(mark);
      if (line) {
        gameOver = true;
        if (mark === PLAYER) scores.player += 1;
        if (mark === COMPUTER) scores.computer += 1;
        statusEl.textContent = `${message} Start a new game.`;
        render(line);
        return true;
      }

      if (availableMoves().length === 0) {
        gameOver = true;
        scores.draw += 1;
        statusEl.textContent = "Draw! Start a new game.";
        render();
        return true;
      }

      statusEl.textContent = "Your turn";
      render();
      return false;
    }

    function resetGame() {
      board = Array(9).fill(EMPTY);
      gameOver = false;
      statusEl.textContent = "Your turn";
      render();
    }

    function startGame() {
      startScreen.classList.remove("active");
      gameScreen.classList.add("active");
      resetGame();
    }

    startGameButton.addEventListener("click", startGame);
    newGameButton.addEventListener("click", resetGame);
    render();
  </script>
</body>
</html>
